#!/usr/bin/env bash
# ==============================================================================
# FastNodeDebian — config/settings.conf
#
# Рабочая платформа: Debian 13 (trixie).
# Debian 9/10/11/12 поддерживаются ТОЛЬКО модулем 00 — обновлением до 13.
# ==============================================================================

# ── Роль сервера ──────────────────────────────────────────────────────────────
# vpn   — узел маршрутизирует трафик: включается ip_forward, UFW разрешает FORWARD
# plain — обычный сервер: форвардинг выключен, UFW запрещает FORWARD
NODE_ROLE="vpn"

# ── Модуль 00: обновление дистрибутива ────────────────────────────────────────
UPGRADE_TARGET="13"            # Целевая версия. Поддерживается только 13.

# ── SSH ───────────────────────────────────────────────────────────────────────
SSH_PORT="2225"                # Порт SSH (не 22)
SSH_PERMIT_ROOT="prohibit-password"   # yes | no | prohibit-password
SSH_PUBLIC_KEY=""              # Публичный ключ; пусто — спросить интерактивно

# Политика пароля. ВАЖНО: значение "no" в прошлой версии отключало пароль
# даже при полном отсутствии ключей и приводило к потере доступа.
#   auto — отключить пароль ТОЛЬКО если найден рабочий authorized_keys (безопасно)
#   no   — отключить пароль принудительно (модуль откажется работать без ключа,
#          если не задан SSH_FORCE_NO_PASSWORD=1)
#   yes  — оставить вход по паролю
SSH_PASSWORD_AUTH="auto"
SSH_FORCE_NO_PASSWORD="0"

SSH_ALLOW_TCP_FORWARDING="no"  # yes — если нужны SSH-туннели и проброс портов
SSH_MAX_AUTH_TRIES="3"
SSH_CONFIRM_TIMEOUT="180"      # Секунд на подтверждение нового порта до авто-отката

# ── SWAP ──────────────────────────────────────────────────────────────────────
SWAP_FILE="/swapfile"
SWAP_SIZE="2G"                 # Используется без вопросов в неинтерактивном режиме
SWAP_SWAPPINESS="10"
SWAP_VFS_CACHE_PRESSURE="50"

# ── Время и локаль ────────────────────────────────────────────────────────────
TIMEZONE="Europe/Moscow"
LOCALE_LANG="ru_RU.UTF-8"
LOCALE_CHARSET="UTF-8"
LOCALE_EXTRA=("en_US.UTF-8 UTF-8")   # Дополнительные локали (нужны многим утилитам)

# ── UFW ───────────────────────────────────────────────────────────────────────
# Дополнительные порты сверх SSH. По умолчанию ПУСТО: открывается только
# SSH_PORT. В интерактивном режиме модуль 07 предложит ввести остальные вручную.
# Формат: "80/tcp", "443/udp", "2000:2100/tcp" или просто "8443" (tcp+udp).
ALLOWED_PORTS=()

# Спрашивать дополнительные порты при интерактивном запуске модуля 07
UFW_ASK_PORTS="yes"
UFW_LOGGING="low"              # off | low | medium | high

# ── Fail2Ban ──────────────────────────────────────────────────────────────────
F2B_BANTIME="3600"
F2B_FINDTIME="600"
F2B_MAXRETRY="5"
F2B_PORTSCAN_BANTIME="86400"
F2B_IGNOREIP="127.0.0.1/8 ::1"
F2B_ENABLE_PORTSCAN="yes"      # Джейл на заблокированные UFW пакеты
F2B_IGNORE_CURRENT_SSH="yes"   # Внести IP текущей SSH-сессии в исключения

# ── XanMod (модуль 09) ────────────────────────────────────────────────────────
XANMOD_BRANCH="main"           # main | lts | edge | rt
XANMOD_INSTALL_HEADERS="yes"
# fq   — универсально и рекомендовано вместе с BBR (по умолчанию)
# fq_pie — есть в XanMod; если модуль sch_fq_pie не загрузится, qdisc не применится
DEFAULT_QDISC="fq"

# ── Базовые пакеты (модуль 01) ────────────────────────────────────────────────
# Недоступные пакеты автоматически отсеиваются и не срывают установку остальных.
REQUIRED_PACKAGES=(
    # Основа
    ca-certificates
    curl
    wget
    gnupg
    openssl
    git
    # Работа с сетью и диагностика
    iproute2
    net-tools
    ethtool
    socat
    nftables
    bind9-dnsutils
    tcpdump
    mtr-tiny
    traceroute
    iftop
    vnstat
    lsof
    # Мониторинг и обслуживание
    htop
    iotop
    ncdu
    sysstat
    tmux
    needrestart
    cron
    logrotate
    # Архивы и форматы
    unzip
    zip
    tar
    xz-utils
    zstd
    jq
    # Утилиты
    bc
    file
    less
    nano
    rsync
    sudo
    qrencode
    lsb-release
    python3-systemd
)

# ── Тюнинг узла (модуль 10) ───────────────────────────────────────────────────
# Модуль 10 — ЕДИНСТВЕННЫЙ владелец сетевых параметров ядра. Модуль 09 их
# больше не пишет: два файла sysctl с одинаковыми ключами уже приводили к тому,
# что действовало непредсказуемое значение.

TUNE_PROFILE="auto"          # auto | proxy | plain
                             # auto = proxy при NODE_ROLE=vpn, иначе plain
                             # proxy — крупные буферы UDP/QUIC, conntrack, порт-рейндж

TUNE_CONNTRACK="auto"        # auto — размер таблицы по объёму RAM; off — не трогать
TUNE_RP_FILTER="loose"       # strict | loose | off
                             # loose (rp_filter=2) нужен при асимметричной
                             # маршрутизации (WARP, policy routing); off снимает
                             # защиту от подмены адреса — включайте осознанно

TUNE_QDISC=""                # пусто — берётся DEFAULT_QDISC
# Лимит открытых дескрипторов. Пусто — 1048576.
# Память расходуется на реально открытые дескрипторы, а не на сам лимит,
# поэтому уменьшать его на слабой VPS смысла нет.
# Модуль автоматически поднимает fs.nr_open до этого значения и НИКОГДА
# не опускает штатный потолок ядра.
TUNE_NOFILE=""
TUNE_PORT_RANGE="10000 65500"   # ip_local_port_range; пусто — не менять

TUNE_NIC="yes"               # максимальные ring buffers на основном интерфейсе
TUNE_ZRAM="no"               # zram-swap (имеет смысл при RAM < 2 ГБ и без swapfile)
TUNE_TRIM_SERVICES="no"      # отключить snapd / ModemManager / multipathd

# Локальный кеширующий DNS (dnsmasq на 127.0.0.1). Заметно снижает задержку на
# прокси-узле. Модуль проверяет, что резолвер отвечает, и откатывается, если нет.
TUNE_DNS_CACHE="no"
TUNE_DNS_UPSTREAM=("1.1.1.1" "1.0.0.1" "8.8.8.8" "9.9.9.9")
